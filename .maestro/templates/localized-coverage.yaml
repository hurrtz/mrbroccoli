appId: com.tobiaswinkler.app.mrbroccoli
name: Localized application coverage
tags:
  - visual
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- assertVisible:
    id: setup-guide-card
- tapOn:
    id: setup-guide-not-now
- assertVisible:
    id: main-screen

# Select the locale through the same settings surface a customer uses.
- tapOn:
    id: main-settings-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-app
    direction: DOWN
- tapOn:
    id: settings-overview-row-app
- tapOn:
    id: app-language-picker
- scrollUntilVisible:
    element:
      id: ^app-language-picker-option-${LOCALE}$
    direction: DOWN
    centerElement: true
- tapOn:
    id: ^app-language-picker-option-${LOCALE}$
- assertVisible:
    id: settings-page-app
- assertVisible:
    id: ^app-settings-page-${LOCALE}$
- tapOn:
    id: app-language-picker
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/language-picker
- tapOn:
    id: app-language-picker-close
- assertVisible:
    id: settings-page-app

# App settings, including long-copy and diagnostics states.
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-app-01
- swipe:
    direction: UP
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-app-02
- swipe:
    direction: UP
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-app-03
- swipe:
    direction: UP
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-app-04
- tapOn:
    id: settings-back-button

# Overview and the two onboarding screens reachable without credentials.
- assertVisible:
    id: settings-page-overview
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-overview-01
- swipe:
    direction: UP
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-overview-02
- scrollUntilVisible:
    element:
      id: settings-guided-setup
    direction: UP
    centerElement: true
- tapOn:
    id: settings-guided-setup
- assertVisible:
    id: setup-guide-card
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/setup-guide-intro
- tapOn:
    id: setup-guide-intro-continue
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/setup-guide-provider
- tapOn:
    id: setup-guide-close
- assertVisible:
    id: main-screen
- tapOn:
    id: main-settings-button
- assertVisible:
    id: settings-page-overview

# Connections.
- scrollUntilVisible:
    element:
      id: settings-overview-row-connections
    direction: DOWN
- tapOn:
    id: settings-overview-row-connections
- assertVisible:
    id: settings-page-connections
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-connections-01
- swipe:
    direction: UP
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-connections-02
- swipe:
    direction: UP
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-connections-03
- swipe:
    direction: UP
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-connections-04
- swipe:
    direction: UP
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-connections-05
- swipe:
    direction: UP
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-connections-06
- tapOn:
    id: settings-back-button

# Thinking.
