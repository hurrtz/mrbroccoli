# Home, drawer, per-conversation controls, and landscape split layout.
- assertVisible:
    id: main-screen
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/home-portrait
- tapOn:
    id: main-conversations-button
- assertVisible:
    id: conversation-drawer-empty-state
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/conversation-drawer
- tapOn:
    id: conversation-drawer-close
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: landscape-left-pane
- assertVisible:
    id: landscape-right-pane
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/home-landscape
- setOrientation: PORTRAIT
