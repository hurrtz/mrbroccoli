- assertVisible:
    id: settings-page-search
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-search-01
- swipe:
    direction: UP
- takeScreenshot:
    path: ${PLATFORM}/locales/${LOCALE}/settings-search-02
- swipe:
    direction: UP
- takeScreenshot:
