appId: ${APP_ID}
name: On-device language voice
tags:
  - runtime
  - on-device
  - voice
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- tapOn:
    id: main-settings-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-local
    direction: DOWN
- tapOn:
    id: settings-overview-row-local
- scrollUntilVisible:
    element:
      id: on-device-language-selection
    direction: DOWN
- tapOn:
    id: on-device-language-selection
- tapOn: ${LANGUAGE_LABEL}
- tapOn: "Done"
- scrollUntilVisible:
    element:
      id: on-device-tts-disclosure
    direction: DOWN
- tapOn:
    id: on-device-tts-disclosure
- scrollUntilVisible:
    element:
      id: on-device-download-${VOICE}
    direction: DOWN
- tapOn:
    id: on-device-download-${VOICE}
- extendedWaitUntil:
    visible:
      id: on-device-test-${VOICE}
    timeout: 180000
- tapOn:
    id: on-device-test-${VOICE}
- extendedWaitUntil:
    visible:
      id: on-device-performance-${VOICE}-measured
    timeout: 120000
