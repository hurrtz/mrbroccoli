appId: ${APP_ID}
name: On-device language voice
tags:
  - runtime
  - on-device
  - voice
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- tapOn:
    id: main-settings-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-listening
    direction: DOWN
- tapOn:
    id: settings-overview-row-listening
- assertVisible:
    id: settings-page-listening
- scrollUntilVisible:
    element:
      id: conversation-languages-picker
    direction: DOWN
- tapOn:
    id: conversation-languages-picker
- tapOn: ${LANGUAGE_LABEL}
- tapOn: "Done"
- tapOn:
    id: settings-back-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-speaking
    direction: DOWN
- tapOn:
    id: settings-overview-row-speaking
- assertVisible:
    id: settings-page-speaking
- scrollUntilVisible:
    element:
      id: local-model-download-${VOICE}
    direction: DOWN
- tapOn:
    id: local-model-download-${VOICE}
- extendedWaitUntil:
    visible:
      id: local-model-test-${VOICE}
    timeout: 180000
- tapOn:
    id: local-model-test-${VOICE}
- extendedWaitUntil:
    visible:
      id: local-model-viable-${VOICE}
    timeout: 120000
