appId: ${APP_ID}
name: On-device speech recognition baseline
tags:
  - runtime
  - on-device
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- tapOn:
    id: "main-settings-button"
- scrollUntilVisible:
    element:
      id: "settings-overview-row-listening"
    direction: DOWN
- tapOn:
    id: "settings-overview-row-listening"
- assertVisible:
    id: "settings-page-listening"
- scrollUntilVisible:
    element:
      id: "local-model-download-whisper-tiny"
    direction: DOWN
- tapOn:
    id: "local-model-download-whisper-tiny"
- extendedWaitUntil:
    visible:
      id: "local-model-test-whisper-tiny"
    timeout: 180000
- tapOn:
    id: "local-model-test-whisper-tiny"
- extendedWaitUntil:
    visible:
      id: "local-model-viable-whisper-tiny"
    timeout: 180000
