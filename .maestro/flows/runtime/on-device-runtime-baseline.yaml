appId: ${APP_ID}
name: On-device local thinking and listening baseline
tags:
  - runtime
  - on-device
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- tapOn:
    id: "main-settings-button"
- scrollUntilVisible:
    element:
      id: "settings-overview-row-thinking"
    direction: DOWN
- tapOn:
    id: "settings-overview-row-thinking"
- assertVisible:
    id: "settings-page-thinking"
- tapOn:
    id: "thinking-add-model"
- assertVisible:
    id: "thinking-add-sheet"
- scrollUntilVisible:
    element:
      id: "local-model-download-qwen3-0.6b-q8"
    direction: DOWN
- tapOn:
    id: "local-model-download-qwen3-0.6b-q8"
- extendedWaitUntil:
    visible:
      id: "local-model-test-qwen3-0.6b-q8"
    timeout: 240000
- tapOn:
    id: "local-model-test-qwen3-0.6b-q8"
- extendedWaitUntil:
    visible:
      id: "local-model-viable-qwen3-0.6b-q8"
    timeout: 180000
- tapOn: "Dismiss"
- tapOn:
    id: "settings-back-button"
- scrollUntilVisible:
    element:
      id: "settings-overview-row-listening"
    direction: DOWN
- tapOn:
    id: "settings-overview-row-listening"
- assertVisible:
    id: "settings-page-listening"
- scrollUntilVisible:
    element:
      id: "local-model-download-whisper-tiny"
    direction: DOWN
- tapOn:
    id: "local-model-download-whisper-tiny"
- extendedWaitUntil:
    visible:
      id: "local-model-test-whisper-tiny"
    timeout: 180000
- tapOn:
    id: "local-model-test-whisper-tiny"
- extendedWaitUntil:
    visible:
      id: "local-model-viable-whisper-tiny"
    timeout: 180000
