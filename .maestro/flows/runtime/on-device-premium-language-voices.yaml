appId: ${APP_ID}
name: On-device Premium language voice pair
tags:
  - runtime
  - on-device
  - voice
  - premium
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- tapOn:
    id: main-settings-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-app
    direction: DOWN
- tapOn:
    id: settings-overview-row-app
- scrollUntilVisible:
    element:
      id: development-entitlement-mode
    direction: DOWN
- tapOn:
    id: development-entitlement-mode-premium
# Changing the development entitlement intentionally returns Settings to its
# overview: the available pages change with the edition.
- scrollUntilVisible:
    element:
      id: settings-overview-row-listening
    direction: DOWN
- tapOn:
    id: settings-overview-row-listening
- assertVisible:
    id: settings-page-listening
- scrollUntilVisible:
    element:
      id: conversation-languages-picker
    direction: DOWN
- tapOn:
    id: conversation-languages-picker
- tapOn: ${LANGUAGE_LABEL}
- tapOn: "English"
- tapOn: "Done"
- tapOn:
    id: settings-back-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-speaking
    direction: DOWN
- tapOn:
    id: settings-overview-row-speaking
- assertVisible:
    id: settings-page-speaking
- scrollUntilVisible:
    element:
      id: local-model-download-${VOICE_ONE}
    direction: DOWN
- tapOn:
    id: local-model-download-${VOICE_ONE}
- extendedWaitUntil:
    visible:
      id: local-model-test-${VOICE_ONE}
    timeout: 180000
- tapOn:
    id: local-model-test-${VOICE_ONE}
- extendedWaitUntil:
    visible:
      id: local-model-viable-${VOICE_ONE}
    timeout: 120000
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: local-model-download-${VOICE_TWO}
    direction: DOWN
- tapOn:
    point: 93%, 92%
- tapOn:
    id: local-model-download-${VOICE_TWO}
- extendedWaitUntil:
    visible:
      id: local-model-test-${VOICE_TWO}
    timeout: 180000
- tapOn:
    id: local-model-test-${VOICE_TWO}
- extendedWaitUntil:
    visible:
      id: local-model-viable-${VOICE_TWO}
    timeout: 120000
