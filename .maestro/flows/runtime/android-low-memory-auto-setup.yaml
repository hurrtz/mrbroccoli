appId: ${APP_ID}
name: Android low-memory automatic setup
tags:
  - runtime
  - android
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- assertVisible:
    id: main-screen
- tapOn:
    id: intro-banner
- tapOn:
    id: intro-stepper-dot-1
- assertVisible:
    id: intro-setup-step
- tapOn:
    id: intro-auto-start
- assertVisible:
    id: auto-setup-card
- extendedWaitUntil:
    visible: "No suitable set for this phone"
    timeout: 15000
- assertVisible: "Try again"
- assertVisible:
    id: intro-manual-switch
- takeScreenshot:
    path: android/runtime/auto-setup-ineligible-first-scan
- tapOn: "Try again"
- extendedWaitUntil:
    visible: "No suitable set for this phone"
    timeout: 15000
- takeScreenshot:
    path: android/runtime/auto-setup-ineligible-retry
- tapOn:
    id: intro-manual-switch
- assertVisible:
    id: intro-manual-catalogue
- scrollUntilVisible:
    element:
      id: intro-manual-llm
    direction: DOWN
- tapOn:
    id: intro-manual-llm
- assertVisible:
    id: settings-page-thinking
- assertVisible:
    id: thinking-add-model
- takeScreenshot:
    path: android/runtime/auto-setup-thinking-handoff
