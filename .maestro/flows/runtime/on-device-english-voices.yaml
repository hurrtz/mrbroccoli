appId: ${APP_ID}
name: On-device English voice installation and synthesis
tags:
  - runtime
  - on-device
  - voice
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- tapOn:
    id: main-settings-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-speaking
    direction: DOWN
- tapOn:
    id: settings-overview-row-speaking
- assertVisible:
    id: settings-page-speaking
- scrollUntilVisible:
    element:
      id: local-model-download-kokoro-multilingual
    direction: DOWN
- tapOn:
    id: local-model-download-kokoro-multilingual
- extendedWaitUntil:
    visible:
      id: local-model-test-kokoro-multilingual
    timeout: 180000
- tapOn:
    id: local-model-test-kokoro-multilingual
- extendedWaitUntil:
    visible:
      id: local-model-viable-kokoro-multilingual
    timeout: 120000
- scrollUntilVisible:
    element:
      id: local-model-download-piper-en-us-kristin
    direction: DOWN
# The development client can show Expo's warning tray over the lower card
# actions. Release builds do not include it; close it here so this native
# download test still reaches the model control.
- tapOn:
    point: 93%, 92%
- tapOn:
    id: local-model-download-piper-en-us-kristin
- extendedWaitUntil:
    visible:
      id: local-model-test-piper-en-us-kristin
    timeout: 180000
- tapOn:
    id: local-model-test-piper-en-us-kristin
- extendedWaitUntil:
    visible:
      id: local-model-viable-piper-en-us-kristin
    timeout: 120000
- scrollUntilVisible:
    element:
      id: local-model-download-piper-en-us-norman
    direction: DOWN
- tapOn:
    id: local-model-download-piper-en-us-norman
- extendedWaitUntil:
    visible:
      id: local-model-test-piper-en-us-norman
    timeout: 180000
- tapOn:
    id: local-model-test-piper-en-us-norman
- extendedWaitUntil:
    visible:
      id: local-model-viable-piper-en-us-norman
    timeout: 120000
