appId: ${APP_ID}
name: On-device recognition model catalogue
tags:
  - runtime
  - on-device
  - expensive-local-download
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- tapOn:
    id: main-settings-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-listening
    direction: DOWN
- tapOn:
    id: settings-overview-row-listening
- assertVisible:
    id: settings-page-listening
- scrollUntilVisible:
    element:
      id: local-model-download-whisper-tiny
    direction: DOWN
- tapOn:
    id: local-model-download-whisper-tiny
- extendedWaitUntil:
    visible:
      id: local-model-test-whisper-tiny
    timeout: 180000
- tapOn:
    id: local-model-test-whisper-tiny
- extendedWaitUntil:
    visible:
      id: local-model-viable-whisper-tiny
    timeout: 180000
- scrollUntilVisible:
    element:
      id: local-model-download-whisper-base
    direction: DOWN
- tapOn:
    id: local-model-download-whisper-base
- extendedWaitUntil:
    visible:
      id: local-model-test-whisper-base
    timeout: 240000
- tapOn:
    id: local-model-test-whisper-base
- extendedWaitUntil:
    visible:
      id: local-model-viable-whisper-base
    timeout: 180000
- scrollUntilVisible:
    element:
      id: local-model-download-whisper-small
    direction: DOWN
- tapOn:
    id: local-model-download-whisper-small
- extendedWaitUntil:
    visible:
      id: local-model-test-whisper-small
    timeout: 240000
- tapOn:
    id: local-model-test-whisper-small
- extendedWaitUntil:
    visible:
      id: local-model-viable-whisper-small
    timeout: 240000
- scrollUntilVisible:
    element:
      id: local-model-download-omnilingual-asr-300m
    direction: DOWN
- tapOn:
    id: local-model-download-omnilingual-asr-300m
- extendedWaitUntil:
    visible:
      id: local-model-test-omnilingual-asr-300m
    timeout: 240000
- tapOn:
    id: local-model-test-omnilingual-asr-300m
- extendedWaitUntil:
    visible:
      id: local-model-viable-omnilingual-asr-300m
    timeout: 240000
- scrollUntilVisible:
    element:
      id: local-model-download-parakeet-tdt-0.6b-v3-int8
    direction: DOWN
- tapOn:
    id: local-model-download-parakeet-tdt-0.6b-v3-int8
- extendedWaitUntil:
    visible:
      id: local-model-test-parakeet-tdt-0.6b-v3-int8
    timeout: 300000
- tapOn:
    id: local-model-test-parakeet-tdt-0.6b-v3-int8
- extendedWaitUntil:
    visible:
      id: local-model-viable-parakeet-tdt-0.6b-v3-int8
    timeout: 300000
- scrollUntilVisible:
    element:
      id: local-model-download-qwen3-asr-0.6b-int8
    direction: DOWN
- tapOn:
    id: local-model-download-qwen3-asr-0.6b-int8
- extendedWaitUntil:
    visible:
      id: local-model-test-qwen3-asr-0.6b-int8
    timeout: 300000
- tapOn:
    id: local-model-test-qwen3-asr-0.6b-int8
- extendedWaitUntil:
    visible:
      id: local-model-viable-qwen3-asr-0.6b-int8
    timeout: 300000
