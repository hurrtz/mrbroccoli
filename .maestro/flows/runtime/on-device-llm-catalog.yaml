appId: ${APP_ID}
name: On-device response model catalogue
tags:
  - runtime
  - on-device
  - expensive-local-download
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- tapOn:
    id: main-settings-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-thinking
    direction: DOWN
- tapOn:
    id: settings-overview-row-thinking
- assertVisible:
    id: settings-page-thinking
- tapOn:
    id: thinking-add-model
- assertVisible:
    id: thinking-add-sheet
- scrollUntilVisible:
    element:
      id: local-model-download-qwen3-0.6b-q8
    direction: DOWN
- tapOn:
    id: local-model-download-qwen3-0.6b-q8
- extendedWaitUntil:
    visible:
      id: local-model-test-qwen3-0.6b-q8
    timeout: 240000
- tapOn:
    id: local-model-test-qwen3-0.6b-q8
- extendedWaitUntil:
    visible:
      id: local-model-viable-qwen3-0.6b-q8
    timeout: 180000
