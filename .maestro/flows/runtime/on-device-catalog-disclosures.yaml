appId: ${APP_ID}
name: Stage-owned on-device model catalogs
tags:
  - runtime
  - on-device
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- assertVisible:
    id: main-screen
- tapOn:
    id: main-settings-button
- assertVisible:
    id: settings-page-overview

# Thinking owns local response models.
- scrollUntilVisible:
    element:
      id: settings-overview-row-thinking
    direction: DOWN
- tapOn:
    id: settings-overview-row-thinking
- assertVisible:
    id: settings-page-thinking
- tapOn:
    id: thinking-add-model
- assertVisible:
    id: thinking-add-sheet
- assertVisible:
    id: thinking-local-model-qwen3-0.6b-q8
- tapOn: "Dismiss"
- tapOn:
    id: settings-back-button

# Listening owns local recognition models.
- scrollUntilVisible:
    element:
      id: settings-overview-row-listening
    direction: DOWN
- tapOn:
    id: settings-overview-row-listening
- assertVisible:
    id: settings-page-listening
- assertVisible:
    id: settings-stt-route-whisper-tiny
- tapOn:
    id: settings-back-button

# Speaking owns local voices.
- scrollUntilVisible:
    element:
      id: settings-overview-row-speaking
    direction: DOWN
- tapOn:
    id: settings-overview-row-speaking
- assertVisible:
    id: settings-page-speaking
- assertVisible:
    id: settings-tts-route-kokoro-multilingual
