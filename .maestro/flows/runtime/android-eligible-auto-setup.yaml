appId: ${APP_ID}
name: Android eligible automatic on-device setup
tags:
  - runtime
  - android
  - physical-device
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- assertVisible:
    id: main-screen
- tapOn:
    id: intro-banner
- tapOn:
    id: intro-stepper-dot-1
- assertVisible:
    id: intro-setup-step
- tapOn:
    id: intro-auto-start
- assertVisible:
    id: auto-setup-card
- assertVisible:
    id: auto-setup-proposal
- assertVisible: "Recommended for this phone"
- scrollUntilVisible:
    element:
      id: auto-setup-install
    direction: DOWN
- assertVisible: "Download and install"
- takeScreenshot:
    path: android-physical/runtime/auto-setup-proposal
- tapOn:
    id: auto-setup-install
- takeScreenshot:
    path: android-physical/runtime/auto-setup-installing
- extendedWaitUntil:
    visible:
      id: auto-setup-done-state
    timeout: 1200000
- scrollUntilVisible:
    element:
      id: auto-setup-done
    direction: UP
- assertVisible: "Installed and selected."
- assertVisible: "Replies, speech input and voice output now work with no network connection."
- takeScreenshot:
    path: android-physical/runtime/auto-setup-ready
- stopApp
- launchApp
- assertVisible:
    id: main-screen
- assertVisible:
    id: intro-banner
- tapOn:
    id: intro-banner-dismiss
- assertNotVisible:
    id: intro-banner
- tapOn:
    id: main-settings-button
- assertVisible:
    id: settings-page-overview
- scrollUntilVisible:
    element:
      id: settings-overview-row-thinking
    direction: DOWN
- tapOn:
    id: settings-overview-row-thinking
- assertVisible:
    id: settings-page-thinking
- assertVisible:
    id: thinking-slot-mode-1
- takeScreenshot:
    path: android-physical/runtime/thinking-model-installed
- tapOn:
    id: settings-back-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-data
    direction: DOWN
- tapOn:
    id: settings-overview-row-data
- assertVisible:
    id: settings-page-data
- scrollUntilVisible:
    element:
      id: model-storage-group
    direction: DOWN
- assertVisible:
    id: model-storage-group
- takeScreenshot:
    path: android-physical/runtime/model-storage-installed
