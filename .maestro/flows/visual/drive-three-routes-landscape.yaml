appId: ${APP_ID}
name: Hands free with three-route picker in landscape
tags:
  - visual
  - layout
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- setOrientation: PORTRAIT
- assertVisible:
    id: main-screen

# A harmless placeholder credential exercises the normal route derivation
# without making a provider request. State and Keychain are cleared per run.
- tapOn:
    id: main-settings-button
- tapOn:
    id: settings-overview-row-connections
- tapOn:
    id: provider-card-anthropic-header-control
- assertVisible: "API key: Anthropic"
- tapOn: "API key: Anthropic"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- inputText: visual-test-only
- assertVisible: "Not tested"
- runFlow:
    when:
      true: ${PLATFORM == 'android'}
    commands:
      - hideKeyboard
- tapOn:
    id: provider-connection-sheet-anthropic-header-handle
- waitForAnimationToEnd
- assertVisible:
    id: settings-back-button
- tapOn:
    id: settings-back-button

- tapOn:
    id: settings-close-button
- waitForAnimationToEnd
- assertNotVisible:
    id: settings-modal-title

# Open the model control in the portrait workspace header to verify the
# three routes derived from the configured provider.
- assertVisible:
    id: workspace-header-settings
- assertVisible:
    id: workspace-header-model
- tapOn:
    id: workspace-header-model
- assertVisible:
    id: route-picker-list
- assertVisible:
    id: route-picker-row-mode-1
- assertVisible:
    id: route-picker-row-mode-2
- assertVisible:
    id: route-picker-row-mode-3
- takeScreenshot:
    path: ${PLATFORM}/visual/drive-three-routes-picker-portrait
- tapOn:
    id: route-picker-row-mode-1
- assertVisible:
    id: satellite-hands-free
    checked: false
- tapOn:
    id: satellite-hands-free
- assertVisible:
    id: satellite-hands-free
    checked: true
- takeScreenshot:
    path: ${PLATFORM}/visual/drive-three-routes-portrait
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: landscape-left-pane
- assertVisible:
    id: landscape-right-pane
- assertVisible:
    id: route-byline
- assertVisible:
    id: satellite-hands-free
    checked: true
- waitForAnimationToEnd
- takeScreenshot:
    path: ${PLATFORM}/visual/drive-three-routes-landscape
- tapOn:
    id: satellite-hands-free
- assertVisible:
    id: satellite-hands-free
    checked: false
- setOrientation: PORTRAIT
