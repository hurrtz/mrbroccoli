appId: ${APP_ID}
name: Drive mode with three-route picker in landscape
tags:
  - visual
  - layout
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- setOrientation: PORTRAIT
- assertVisible:
    id: main-screen
- assertVisible:
    id: intro-banner

# A harmless placeholder credential exercises the normal route derivation
# without making a provider request. State and Keychain are cleared per run.
- tapOn:
    id: main-settings-button
- tapOn:
    id: settings-overview-row-connections
- tapOn:
    id: provider-card-anthropic-header-control
- assertVisible: "API key: Anthropic"
- tapOn: "API key: Anthropic"
- inputText: visual-test-only
- pressKey: ENTER
- tapOn:
    id: settings-back-button

# Select Drive mode through the real settings surface.
- tapOn:
    id: settings-overview-row-listening
- assertVisible:
    id: input-mode-picker-drive-session
- tapOn:
    id: input-mode-picker-drive-session
- tapOn:
    id: settings-back-button
- tapOn:
    id: settings-close-button

# The approved workspace exposes one active-route byline. Open its picker to
# prove all three derived routes, then close it through the active route.
- assertVisible:
    id: route-byline
- tapOn:
    id: route-byline
- assertVisible:
    id: route-picker-list
- assertVisible:
    id: route-picker-row-mode-1
- assertVisible:
    id: route-picker-row-mode-2
- assertVisible:
    id: route-picker-row-mode-3
- takeScreenshot:
    path: ${PLATFORM}/visual/drive-three-routes-picker-portrait
- tapOn:
    id: route-picker-row-mode-1
- assertVisible:
    id: drive-session-controls
- takeScreenshot:
    path: ${PLATFORM}/visual/drive-three-routes-portrait
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: landscape-left-pane
- assertVisible:
    id: landscape-right-pane
- assertVisible:
    id: route-byline
- assertVisible:
    id: drive-session-controls
- takeScreenshot:
    path: ${PLATFORM}/visual/drive-three-routes-landscape
- setOrientation: PORTRAIT
