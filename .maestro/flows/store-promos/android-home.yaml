appId: ${APP_ID}
name: Google Play voice conversation screenshots
tags:
  - store-promos
  - android
---
- assertVisible:
    id: store-promo-fixture-ready-conversation
- stopApp
- launchApp
- setOrientation: PORTRAIT
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: voice-stage-idle
- assertVisible:
    id: transcript-handle
- takeScreenshot:
    path: 01-home-idle
- tapOn:
    id: transcript-handle
- assertVisible:
    id: chat-transcript-list
- assertVisible:
    id: transcript-message-promo-user-1
- assertVisible:
    id: transcript-message-promo-assistant-2
- tapOn:
    id: transcript-toggle-promo-assistant-2
- waitForAnimationToEnd
- takeScreenshot:
    path: 02-transcript-last-response
- stopApp
