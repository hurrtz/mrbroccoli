appId: ${APP_ID}
name: Google Play Premium organization and settings screenshots
tags:
  - store-promos
  - android
---
# The runner restores the Premium fixture using a package-targeted Android
# intent before this flow.
- assertVisible:
    id: store-promo-fixture-ready-premium
- stopApp
- launchApp
- setOrientation: PORTRAIT
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: voice-stage-thinking
- tapOn:
    id: main-conversations-button
- assertVisible:
    id: conversation-drawer-item-promo-root
- assertVisible:
    id: conversation-drawer-item-promo-branch
- takeScreenshot:
    path: 08-conversation-branches
- tapOn:
    id: conversation-drawer-close
- waitForAnimationToEnd
- assertNotVisible:
    id: conversation-drawer-close
- tapOn:
    id: main-settings-button
- assertVisible:
    id: settings-page-overview
- takeScreenshot:
    path: 09-premium-settings
- scrollUntilVisible:
    element:
      id: settings-overview-row-thinking
    direction: DOWN
- tapOn:
    id: settings-overview-row-thinking
- assertVisible:
    id: settings-page-thinking
- assertVisible:
    id: settings-modal-title
- assertVisible:
    id: settings-close-button
- takeScreenshot:
    path: 10-premium-thinking
- tapOn:
    id: settings-back-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-speaking
    direction: DOWN
- tapOn:
    id: settings-overview-row-speaking
- assertVisible:
    id: settings-page-speaking
- assertVisible:
    id: settings-modal-title
- assertVisible:
    id: settings-close-button
- takeScreenshot:
    path: 11-premium-speaking
- tapOn:
    id: settings-back-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-app
    direction: DOWN
- tapOn:
    id: settings-overview-row-app
- assertVisible:
    id: settings-page-app
- assertVisible:
    id: ^app-settings-page-${LOCALE}$
- assertVisible:
    id: automatic-setup-group
- assertVisible:
    id: auto-setup-card
- assertVisible:
    id: settings-modal-title
- assertVisible:
    id: settings-close-button
- takeScreenshot:
    path: 12-automatic-setup
- tapOn:
    id: settings-close-button
- waitForAnimationToEnd
- assertNotVisible:
    id: settings-modal-title

- assertVisible:
    id: conversation-settings-summary-control
- tapOn:
    id: conversation-settings-summary-control
- assertVisible:
    id: conversation-settings-drawer
- takeScreenshot:
    path: 13-conversation-settings
