appId: ${APP_ID}
name: Google Play deterministic onboarding live-test screenshot
tags:
  - store-promos
  - android
---
# The offline-ready fixture unlocks the final first-run screen without a
# download, benchmark, microphone session, or provider call.
- assertVisible:
    id: store-promo-fixture-ready-onboarding-ready
- stopApp
- launchApp
- setOrientation: PORTRAIT
- assertVisible:
    id: main-screen
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: intro-banner
- tapOn:
    id: intro-banner
- assertVisible:
    id: intro-flow-content
- tapOn:
    id: intro-stepper-dot-2
- assertVisible:
    id: intro-try-step
- takeScreenshot:
    path: 07-onboarding-try
- stopApp
