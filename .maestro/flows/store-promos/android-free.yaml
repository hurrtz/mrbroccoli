appId: ${APP_ID}
name: Google Play Free conversation screenshot
tags:
  - store-promos
  - android
---
# The runner opens the Free fixture using a package-targeted Android intent.
- assertVisible:
    id: store-promo-fixture-ready-free
- stopApp
- launchApp
- setOrientation: PORTRAIT
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: voice-stage-idle
- assertVisible:
    id: transcript-handle
- takeScreenshot:
    path: 02-free-conversation
- stopApp
