appId: ${APP_ID}
name: Google Play Free conversation screenshot
tags:
  - store-promos
  - android
---
# The runner opens the Free fixture using a package-targeted Android intent.
- assertVisible:
    id: store-promo-fixture-ready-free
- stopApp
- launchApp
- setOrientation: PORTRAIT
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: voice-stage-idle
- assertVisible:
    id: transcript-handle
- takeScreenshot:
    path: 03-free-conversation
- tapOn:
    id: main-settings-button
- assertVisible:
    id: settings-page-overview
- scrollUntilVisible:
    element:
      id: settings-premium-upgrade-band-action
    direction: DOWN
- tapOn:
    id: settings-premium-upgrade-band-action
- assertVisible:
    id: premium-upgrade-scroll
- assertVisible:
    id: premium-value-card
- takeScreenshot:
    path: 04-premium-price
- stopApp
