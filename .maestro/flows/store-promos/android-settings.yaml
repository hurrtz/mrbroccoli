appId: ${APP_ID}
name: Google Play organization and BYOK settings screenshots
tags:
  - store-promos
  - android
---
- assertVisible:
    id: store-promo-fixture-ready-conversation
- stopApp
- launchApp
- setOrientation: PORTRAIT
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: voice-stage-idle
- tapOn:
    id: main-conversations-button
- assertVisible:
    id: conversation-drawer-item-promo-root
- assertVisible:
    id: conversation-drawer-item-promo-branch
- assertVisible:
    id: conversation-section-pinned
- assertVisible:
    id: conversation-section-earlier
- takeScreenshot:
    path: 03-conversations
- tapOn:
    id: conversation-drawer-close
- waitForAnimationToEnd
- assertNotVisible:
    id: conversation-drawer-close
- tapOn:
    id: main-settings-button
- assertVisible:
    id: settings-page-overview
- scrollUntilVisible:
    element:
      id: settings-overview-row-connections
    direction: DOWN
- tapOn:
    id: settings-overview-row-connections
- assertVisible:
    id: settings-page-connections
- takeScreenshot:
    path: 04-settings-connections
- tapOn:
    id: settings-back-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-thinking
    direction: DOWN
- tapOn:
    id: settings-overview-row-thinking
- assertVisible:
    id: settings-page-thinking
- takeScreenshot:
    path: 05-settings-thinking
- tapOn:
    id: settings-close-button
- waitForAnimationToEnd
- assertNotVisible:
    id: settings-modal-title
- assertVisible:
    id: voice-stage-idle
- tapOn:
    id: satellite-council
- assertVisible:
    id: council-popover
- assertVisible:
    id: council-model-mode-1
- assertVisible:
    id: council-model-mode-2
- assertVisible:
    id: council-model-mode-3
- tapOn:
    id: council-model-mode-2
- tapOn:
    id: council-model-mode-3
- takeScreenshot:
    path: 06-council
- stopApp
