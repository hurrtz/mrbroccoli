appId: ${APP_ID}
name: Google Play Premium active conversation screenshot
tags:
  - store-promos
  - android
---
# The runner opens the Premium fixture using a package-targeted Android intent.
- assertVisible:
    id: store-promo-fixture-ready-premium
- stopApp
- launchApp
- setOrientation: PORTRAIT
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: voice-stage-thinking
- assertVisible:
    id: transcript-handle
- takeScreenshot:
    path: 01-premium-active-conversation
- tapOn:
    id: transcript-handle
- assertVisible:
    id: chat-transcript-list
- assertVisible:
    id: transcript-message-promo-user-1
- assertVisible:
    id: transcript-message-promo-assistant-2
- takeScreenshot:
    path: 02-transcript-drawer
- stopApp
