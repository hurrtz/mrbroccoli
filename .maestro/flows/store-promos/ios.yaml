appId: ${APP_ID}
name: App Store BYOK story screenshots
tags:
  - store-promos
  - ios
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- setOrientation: PORTRAIT
- tapOn:
    text: Cancel
    optional: true
- openLink: "mrbroccoli://store-promos?locale=${LOCALE}&scene=conversation&colorScheme=${COLOR_SCHEME}&phase=idle&phaseProgress=0&turnProgress=0&overtime=0"
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: store-promo-fixture-ready-conversation
- stopApp
- launchApp
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: voice-stage-idle
- assertVisible:
    id: transcript-handle
- takeScreenshot:
    path: 01-home-idle
- tapOn:
    id: transcript-handle
- assertVisible:
    id: chat-transcript-list
- assertVisible:
    id: transcript-message-promo-assistant-2
- tapOn:
    id: transcript-toggle-promo-assistant-2
- waitForAnimationToEnd
- takeScreenshot:
    path: 02-transcript-last-response
- stopApp
- launchApp
- assertVisible:
    id: transcript-handle
- runFlow:
    when:
      true: ${DEVICE_CLASS != 'ipad'}
    commands:
      - tapOn:
          id: main-conversations-button
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'ipad'}
    commands:
      - assertVisible:
          id: ipad-regular-shell
- assertVisible:
    id: conversation-drawer-item-promo-root
- assertVisible:
    id: conversation-drawer-item-promo-branch
- assertVisible:
    id: conversation-section-pinned
- assertVisible:
    id: conversation-section-earlier
- takeScreenshot:
    path: 03-conversations
- runFlow:
    when:
      true: ${DEVICE_CLASS != 'ipad'}
    commands:
      - tapOn:
          id: conversation-drawer-close
      - waitForAnimationToEnd
      - assertNotVisible:
          id: conversation-drawer-close
      - tapOn:
          id: main-settings-button
      - assertVisible:
          id: settings-page-overview
      - scrollUntilVisible:
          element:
            id: settings-overview-row-connections
          direction: DOWN
      - tapOn:
          id: settings-overview-row-connections
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'ipad'}
    commands:
      - tapOn:
          id: conversation-drawer-settings
      - assertVisible:
          id: settings-ipad-category-nav
      - assertVisible:
          id: settings-page-connections
- assertVisible:
    id: settings-page-connections
- takeScreenshot:
    path: 04-settings-connections
- runFlow:
    when:
      true: ${DEVICE_CLASS != 'ipad'}
    commands:
      - tapOn:
          id: settings-back-button
      - scrollUntilVisible:
          element:
            id: settings-overview-row-thinking
          direction: DOWN
      - tapOn:
          id: settings-overview-row-thinking
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'ipad'}
    commands:
      - tapOn:
          id: settings-ipad-category-row-thinking
- assertVisible:
    id: settings-page-thinking
- takeScreenshot:
    path: 05-settings-thinking
- tapOn:
    id: settings-close-button
- waitForAnimationToEnd
- assertNotVisible:
    id: settings-modal-title
- assertVisible:
    id: voice-stage-idle
- tapOn:
    id: satellite-council
- assertVisible:
    id: council-popover
- assertVisible:
    id: council-model-mode-1
- assertVisible:
    id: council-model-mode-2
- assertVisible:
    id: council-model-mode-3
- tapOn:
    id: council-model-mode-2
- tapOn:
    id: council-model-mode-3
- takeScreenshot:
    path: 06-council
- stopApp
- launchApp:
    appId: ${APP_ID}
- assertVisible:
    id: workspace-header-settings
- tapOn:
    id: workspace-header-settings
- assertVisible:
    id: conversation-settings-drawer
- takeScreenshot:
    path: 07-conversation-settings
