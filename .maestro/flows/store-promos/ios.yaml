appId: ${APP_ID}
name: App Store BYOK story screenshots
tags:
  - store-promos
  - ios
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- setOrientation: PORTRAIT
- tapOn:
    text: Cancel
    optional: true
- openLink: "mrbroccoli://store-promos?locale=${LOCALE}&scene=conversation&colorScheme=${COLOR_SCHEME}"
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: store-promo-fixture-ready-conversation
- stopApp
- launchApp
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: voice-stage-thinking
- assertVisible:
    id: transcript-handle
- takeScreenshot:
    path: 01-voice-first-conversation
- tapOn:
    id: transcript-handle
- assertVisible:
    id: chat-transcript-list
- assertVisible:
    id: transcript-message-promo-assistant-2
- takeScreenshot:
    path: 02-complete-transcript
- stopApp
- launchApp
- assertVisible:
    id: transcript-handle
- runFlow:
    when:
      true: ${DEVICE_CLASS != 'ipad'}
    commands:
      - tapOn:
          id: main-conversations-button
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'ipad'}
    commands:
      - assertVisible:
          id: ipad-regular-shell
- assertVisible:
    id: conversation-drawer-item-promo-root
- assertVisible:
    id: conversation-drawer-item-promo-branch
- takeScreenshot:
    path: 03-conversation-branches
- runFlow:
    when:
      true: ${DEVICE_CLASS != 'ipad'}
    commands:
      - tapOn:
          id: conversation-drawer-close
      - waitForAnimationToEnd
      - assertNotVisible:
          id: conversation-drawer-close
      - tapOn:
          id: main-settings-button
      - assertVisible:
          id: settings-page-overview
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'ipad'}
    commands:
      - tapOn:
          id: conversation-drawer-settings
      - assertVisible:
          id: settings-ipad-category-nav
      - assertVisible:
          id: settings-page-connections
- takeScreenshot:
    path: 04-byok-settings
- runFlow:
    when:
      true: ${DEVICE_CLASS != 'ipad'}
    commands:
      - scrollUntilVisible:
          element:
            id: settings-overview-row-thinking
          direction: DOWN
      - tapOn:
          id: settings-overview-row-thinking
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'ipad'}
    commands:
      - tapOn:
          id: settings-ipad-category-row-thinking
- assertVisible:
    id: settings-page-thinking
- takeScreenshot:
    path: 05-choose-exact-model
- runFlow:
    when:
      true: ${DEVICE_CLASS != 'ipad'}
    commands:
      - tapOn:
          id: settings-back-button
      - scrollUntilVisible:
          element:
            id: settings-overview-row-speaking
          direction: DOWN
      - tapOn:
          id: settings-overview-row-speaking
- runFlow:
    when:
      true: ${DEVICE_CLASS == 'ipad'}
    commands:
      - tapOn:
          id: settings-ipad-category-row-speaking
- assertVisible:
    id: settings-page-speaking
- takeScreenshot:
    path: 06-choose-your-voice
- tapOn:
    id: settings-close-button
- waitForAnimationToEnd
- assertNotVisible:
    id: settings-modal-title
- stopApp
- openLink: "mrbroccoli://store-promos?locale=${LOCALE}&scene=conversation&colorScheme=${COLOR_SCHEME}&phase=idle&phaseProgress=0&turnProgress=0&overtime=0"
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: voice-stage-idle
- assertVisible:
    id: conversation-settings-summary-control
- tapOn:
    id: conversation-settings-summary-control
- assertVisible:
    id: conversation-settings-drawer
- takeScreenshot:
    path: 07-conversation-settings
