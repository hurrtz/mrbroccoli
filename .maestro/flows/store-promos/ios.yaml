appId: ${APP_ID}
name: App Store promotional screenshots
tags:
  - store-promos
  - ios
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- setOrientation: PORTRAIT
- tapOn:
    text: Cancel
    optional: true

# Premium story: a deterministic completed exchange with the next turn held
# in a stable thinking phase. No provider call is made.
- openLink: "mrbroccoli://store-promos?locale=${LOCALE}&scene=premium"
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: store-promo-fixture-ready-premium
- stopApp
- launchApp
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: voice-stage-thinking
- assertVisible:
    id: transcript-handle
- takeScreenshot:
    path: 01-premium-active-conversation
- tapOn:
    id: transcript-handle
- assertVisible:
    id: selectable-message-promo-assistant-2
- tapOn:
    id: uber-audit-toggle-promo-assistant-2
- takeScreenshot:
    path: 02-uber-mode-audit
- stopApp

# Free story: two complete exchanges at rest.
- openLink: "mrbroccoli://store-promos?locale=${LOCALE}&scene=free"
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: store-promo-fixture-ready-free
- stopApp
- launchApp
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: voice-stage-idle
- assertVisible:
    id: transcript-handle
- takeScreenshot:
    path: 03-free-conversation
- stopApp

# Reseed a genuine first-run intro in the same locale. The fixture projects a
# fixed proposal from the checked-in device profile; it never starts a scan.
- openLink: "mrbroccoli://store-promos?locale=${LOCALE}&scene=onboarding"
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: store-promo-fixture-ready-onboarding
- stopApp
- launchApp
- assertVisible:
    id: main-screen
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: intro-banner
- tapOn:
    id: intro-banner
- assertVisible:
    id: intro-flow-content
- tapOn:
    id: intro-stepper-dot-1
- assertVisible:
    id: intro-setup-step
- assertVisible:
    id: auto-setup-card
- assertVisible:
    id: auto-setup-proposal
- takeScreenshot:
    path: 04-free-onboarding
- stopApp

# Return to Premium for organization and configuration surfaces.
- openLink: "mrbroccoli://store-promos?locale=${LOCALE}&scene=premium"
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: store-promo-fixture-ready-premium
- stopApp
- launchApp
- assertVisible:
    id: ^app-locale-${LOCALE}$
- assertVisible:
    id: voice-stage-thinking
- tapOn:
    id: main-conversations-button
- assertVisible:
    id: conversation-drawer-item-promo-root
- tapOn:
    id: conversation-branch-toggle-promo-root
- assertVisible:
    id: conversation-drawer-item-promo-branch
- takeScreenshot:
    path: 05-conversation-branches
- tapOn:
    id: conversation-drawer-close
- waitForAnimationToEnd
- assertNotVisible:
    id: conversation-drawer-close
- tapOn:
    id: main-settings-button
- assertVisible:
    id: settings-page-overview
- takeScreenshot:
    path: 06-premium-settings
- scrollUntilVisible:
    element:
      id: settings-overview-row-thinking
    direction: DOWN
- tapOn:
    id: settings-overview-row-thinking
- assertVisible:
    id: settings-page-thinking
- assertVisible:
    id: settings-modal-title
- assertVisible:
    id: settings-close-button
- takeScreenshot:
    path: 07-premium-thinking
- tapOn:
    id: settings-back-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-speaking
    direction: DOWN
- tapOn:
    id: settings-overview-row-speaking
- assertVisible:
    id: settings-page-speaking
- assertVisible:
    id: settings-modal-title
- assertVisible:
    id: settings-close-button
- takeScreenshot:
    path: 08-premium-speaking
- tapOn:
    id: settings-back-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-app
    direction: DOWN
- tapOn:
    id: settings-overview-row-app
- assertVisible:
    id: settings-page-app
- assertVisible:
    id: ^app-settings-page-${LOCALE}$
- assertVisible:
    id: automatic-setup-group
- assertVisible:
    id: auto-setup-card
- assertVisible:
    id: settings-modal-title
- assertVisible:
    id: settings-close-button
- takeScreenshot:
    path: 09-automatic-setup
- tapOn:
    id: settings-close-button
- waitForAnimationToEnd
- assertNotVisible:
    id: settings-modal-title

- assertVisible:
    id: conversation-settings-summary-control
- tapOn:
    id: conversation-settings-summary-control
- assertVisible:
    id: conversation-settings-drawer
- takeScreenshot:
    path: 10-conversation-settings
