appId: ${APP_ID}
name: App Store promotional screenshots
tags:
  - store-promos
  - ios
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- setOrientation: PORTRAIT
- tapOn:
    text: Cancel
    optional: true
- assertVisible:
    id: setup-guide-card
- tapOn:
    id: setup-guide-not-now
- assertVisible:
    id: main-screen

# Select the locale through the same UI customers use. The first two images
# intentionally show a clean application before the promotional fixture is
# installed.
- tapOn:
    id: main-settings-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-app
    direction: DOWN
- tapOn:
    id: settings-overview-row-app
- tapOn:
    id: app-language-picker
- scrollUntilVisible:
    element:
      id: ^app-language-picker-option-${LOCALE}$
    direction: DOWN
- runFlow:
    when:
      true: ${LOCALE_NEEDS_SAFE_SCROLL == 'true'}
    commands:
      - swipe:
          start: 50%,80%
          end: 50%,65%
          duration: 400
- tapOn:
    id: ^app-language-picker-option-${LOCALE}$
- assertVisible:
    id: ^app-settings-page-${LOCALE}$
- tapOn:
    id: settings-close-button
- assertVisible:
    id: main-screen
- takeScreenshot:
    path: 01-raw-home
- tapOn:
    id: main-conversations-button
- assertVisible:
    id: conversation-drawer-empty-state
- takeScreenshot:
    path: 02-raw-conversation-drawer
- tapOn:
    id: conversation-drawer-close

# The route is inert in production and seeds data only for the isolated
# `.maestro` application identity.
- openLink: mrbroccoli://store-promos?locale=${LOCALE}
- tapOn:
    text: Open
    optional: true
- assertVisible:
    id: store-promo-fixture-ready
- stopApp
- launchApp
- assertVisible:
    id: main-screen
- assertVisible:
    id: selectable-message-promo-assistant-2
- takeScreenshot:
    path: 03-active-conversation
- assertVisible:
    id: uber-audit-toggle-promo-assistant-2
- tapOn:
    id: uber-audit-toggle-promo-assistant-2
- takeScreenshot:
    path: 04-active-uber-audit

- tapOn:
    id: main-conversations-button
- assertVisible:
    id: conversation-drawer-item-promo-root
- takeScreenshot:
    path: 05-active-conversation-drawer
- tapOn:
    id: conversation-branch-toggle-promo-root
- assertVisible:
    id: conversation-drawer-item-promo-branch
- takeScreenshot:
    path: 06-active-conversation-branches
- tapOn:
    id: conversation-drawer-close

- tapOn:
    id: main-settings-button
- assertVisible:
    id: settings-page-overview
- takeScreenshot:
    path: 07-premium-settings-overview
- scrollUntilVisible:
    element:
      id: settings-overview-row-thinking
    direction: DOWN
- tapOn:
    id: settings-overview-row-thinking
- assertVisible:
    id: settings-page-thinking
- takeScreenshot:
    path: 08-thinking-and-uber-mode
- tapOn:
    id: settings-back-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-speaking
    direction: DOWN
- tapOn:
    id: settings-overview-row-speaking
- assertVisible:
    id: settings-page-speaking
- takeScreenshot:
    path: 09-speaking-and-voices
- tapOn:
    id: settings-back-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-data
    direction: DOWN
- tapOn:
    id: settings-overview-row-data
- assertVisible:
    id: settings-page-data
- takeScreenshot:
    path: 10-data-and-privacy
