appId: ${APP_ID}
name: Google Play promotional screenshots
tags:
  - store-promos
  - android
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- setOrientation: PORTRAIT
- assertVisible:
    id: setup-guide-card
- tapOn:
    id: setup-guide-not-now
- assertVisible:
    id: main-screen

# Select the locale through the same UI customers use. The first two images
# intentionally show a clean application before the promotional fixture is
# installed.
- tapOn:
    id: main-settings-button
- scrollUntilVisible:
    element:
      id: settings-overview-row-app
    direction: DOWN
- tapOn:
    id: settings-overview-row-app
- tapOn:
    id: app-language-picker
- scrollUntilVisible:
    element:
      id: ^app-language-picker-option-${LOCALE}$
    direction: DOWN
- runFlow:
    when:
      true: ${LOCALE_NEEDS_SAFE_SCROLL == 'true'}
    commands:
      - swipe:
          start: 50%,80%
          end: 50%,65%
          duration: 400
- tapOn:
    id: ^app-language-picker-option-${LOCALE}$
- assertVisible:
    id: ^app-settings-page-${LOCALE}$
- tapOn:
    id: settings-close-button
- assertVisible:
    id: main-screen
- takeScreenshot:
    path: 01-raw-home
- tapOn:
    id: main-conversations-button
- assertVisible:
    id: conversation-drawer-empty-state
- takeScreenshot:
    path: 02-raw-conversation-drawer
- tapOn:
    id: conversation-drawer-close
