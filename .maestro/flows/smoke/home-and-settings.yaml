appId: ${APP_ID}
name: Home and settings smoke test
tags:
  - smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- setOrientation: PORTRAIT
- assertVisible:
    id: main-screen
- assertVisible:
    id: intro-banner
- takeScreenshot:
    path: ${PLATFORM}/smoke/intro-banner-home
- tapOn:
    id: intro-banner
- assertVisible:
    id: intro-flow-content
- assertVisible:
    id: intro-welcome-play
- takeScreenshot:
    path: ${PLATFORM}/smoke/intro-01-welcome
- tapOn:
    id: intro-welcome-play
- extendedWaitUntil:
    visible:
      id: intro-welcome-stop
    timeout: 3000
- takeScreenshot:
    path: ${PLATFORM}/smoke/intro-01-audio-playing
- tapOn:
    id: intro-welcome-stop
- tapOn:
    id: intro-stepper-dot-1
- assertVisible:
    id: intro-setup-step
- assertVisible:
    id: intro-auto-start
- takeScreenshot:
    path: ${PLATFORM}/smoke/intro-02-setup-offer
- tapOn:
    id: intro-manual-switch
- assertVisible:
    id: intro-manual-catalogue
- takeScreenshot:
    path: ${PLATFORM}/smoke/intro-02-setup-manual
- stopApp
- launchApp
- assertVisible:
    id: main-screen
- assertVisible:
    id: intro-banner
- tapOn:
    id: intro-banner-dismiss
- assertNotVisible:
    id: intro-banner
- takeScreenshot:
    path: ${PLATFORM}/smoke/home-portrait
- tapOn:
    id: main-settings-button
- assertVisible:
    id: settings-page-overview
- takeScreenshot:
    path: ${PLATFORM}/smoke/settings-overview
- scrollUntilVisible:
    element:
      id: settings-overview-row-app
    direction: DOWN
- tapOn:
    id: settings-overview-row-app
- assertVisible:
    id: settings-page-app
- takeScreenshot:
    path: ${PLATFORM}/smoke/settings-app
- tapOn:
    id: settings-back-button
- tapOn:
    id: settings-close-button
- waitForAnimationToEnd
- assertNotVisible:
    id: settings-modal-title
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: landscape-left-pane
- assertVisible:
    id: landscape-right-pane
- takeScreenshot:
    path: ${PLATFORM}/smoke/home-landscape
- setOrientation: PORTRAIT
