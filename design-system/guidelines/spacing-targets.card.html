<!-- @dsCard group="Spacing" viewport="700x150" name="Touch targets" subtitle="44pt floor on every control; a smaller glyph may sit inside it" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;display:flex;align-items:center;gap:20px;background:var(--mb-color-background)}.t{position:relative;width:44px;height:44px;border-radius:12px;border:1px dashed var(--mb-color-accent);display:flex;align-items:center;justify-content:center}.g{background:var(--mb-color-text-secondary);border-radius:3px}.n{font-family:var(--mb-font-mono);font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--mb-color-text-muted)}.c{display:flex;flex-direction:column;align-items:center;gap:8px}.bar{height:46px;border-radius:10px;border:1px dashed var(--mb-color-accent);display:flex;align-items:center;padding:0 14px;font-family:var(--mb-font-body);font-size:15px;color:var(--mb-color-text)}</style>
</head><body>
<div class="c"><div class="t"><span class="g" style="width:14px;height:14px"></span></div><span class="n">44 · inline 14</span></div>
<div class="c"><div class="t"><span class="g" style="width:20px;height:20px"></span></div><span class="n">44 · control 20</span></div>
<div class="c"><div class="t"><span class="g" style="width:24px;height:24px"></span></div><span class="n">44 · navigation 24</span></div>
<div class="c" style="flex:1"><div class="bar">List and picker rows</div><span class="n">row 46</span></div>
<div class="c" style="flex:1"><div class="bar" style="height:68px;border-radius:17px">Voice stage</div><span class="n">stage 68</span></div>
</body></html>
