<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:flex;gap:18px;align-items:center;background:var(--mb-color-background)}.c{display:flex;flex-direction:column;align-items:center;gap:8px}.n{font-family:var(--mb-font-mono);font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--mb-color-text-muted)}img{display:block;border-radius:22px}</style>
</head><body>
<div class="c"><img src="../assets/appIcon/ios.png" width="120" height="120" alt="Mr Broccoli app icon"><span class="n">iOS</span></div>
<div class="c"><img src="../assets/appIcon/android-foreground.png" width="120" height="120" alt="Android icon" style="background:#FCFBF8"><span class="n">Android</span></div>
<div class="c"><img src="../assets/appIcon/android-monochrome.png" width="120" height="120" alt="Monochrome icon" style="background:var(--mb-color-surface-alt)"><span class="n">Monochrome</span></div>
<div class="c" style="align-items:flex-start;max-width:250px"><span style="font-family:var(--mb-font-body);font-size:13px;line-height:19px;color:var(--mb-color-text-secondary)">The icon is the only illustration in the product. It never appears inside the app — the wordmark carries the brand on screen.</span></div>
</body></html>
