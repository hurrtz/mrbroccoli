<!-- @dsCard group="Spacing" viewport="700x220" name="Elevation" subtitle="Light lifts by whiteness, dark by lightness — both rely on hairlines" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}.card{border-radius:12px;padding:10px 12px;font-family:var(--mb-font-body);font-size:13px}.n{font-family:var(--mb-font-mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase;opacity:.7;display:block;margin-top:2px}</style>
</head><body>
<div class="pane" style="background:#FCFBF8;border:1px solid #D9D7D1;color:#1A1D24">
<div class="card" style="background:#FFFFFF;border:1px solid #D9D7D1">Card on canvas<span class="n">white card, hairline border</span></div>
<div class="card" style="background:#FFFFFF;border:1px solid #D9D7D1;box-shadow:0 8px 24px rgba(23,25,29,0.08)">Dialog<span class="n">0 8 24 · glow 8%</span></div>
</div>
<div class="pane" style="background:#16181D;border:1px solid #2C3138;color:#EDF1F5">
<div class="card" style="background:#1D2025;border:1px solid #2C3138">Card on canvas<span class="n">surface steps up in lightness</span></div>
<div class="card" style="background:#262B33;border:1px solid #3B424D">Raised<span class="n">a shadow here would be invisible</span></div>
</div>
</body></html>
