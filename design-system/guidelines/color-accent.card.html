<!-- @dsCard group="Colors" viewport="700x150" name="Accent" subtitle="One green does the active route, the primary action and confirmation" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{border-radius:12px;border:1px solid var(--mb-color-border);padding:12px;display:flex;gap:10px}.col{flex:1;display:flex;flex-direction:column;gap:6px}.block{height:44px;border-radius:8px;display:flex;align-items:flex-end;padding:6px 8px}.n{font-family:var(--mb-font-mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase}</style>
</head><body>
<div class="pane" style="background:#FCFBF8">
<div class="col"><div class="block" style="background:#44A055;color:#FFF"><span class="n">accent #44A055</span></div>
<div class="block" style="background:#378445;color:#FFF"><span class="n">active #378445</span></div></div>
<div class="col"><div class="block" style="background:#E7F3E9;color:#1A1D24"><span class="n">accent-soft #E7F3E9</span></div>
<div class="block" style="background:#FFFFFF;color:#1A1D24;border:1px solid #D9D7D1"><span class="n">on-accent #FFFFFF</span></div></div>
</div>
<div class="pane" style="background:#16181D">
<div class="col"><div class="block" style="background:#5DC17D;color:#16181D"><span class="n">accent #5DC17D</span></div>
<div class="block" style="background:#5DC17D;color:#16181D"><span class="n">active #5DC17D</span></div></div>
<div class="col"><div class="block" style="background:#1A3423;color:#EDF1F5"><span class="n">accent-soft #1A3423</span></div>
<div class="block" style="background:#16181D;color:#EDF1F5;border:1px solid #2C3138"><span class="n">on-active #16181D</span></div></div>
</div>
</body></html>
