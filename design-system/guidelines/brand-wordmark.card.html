<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<div class="pane" style="background:#FCFBF8"><span class="w" style="color:#1A1D24">Mr Broccoli</span><span class="pill" style="background:#FFFFFF;border:1px solid #D9D7D1;color:#1A1D24">Mr Broccoli</span></div>
<div class="pane" style="background:#16181D"><span class="w" style="color:#EDF1F5">Mr Broccoli</span><span class="pill" style="background:#1D2025;border:1px solid #2C3138;color:#EDF1F5">Mr Broccoli</span></div>
</body></html>
