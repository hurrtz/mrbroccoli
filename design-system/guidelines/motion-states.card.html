<!-- @dsCard group="Spacing" viewport="700x130" name="States" subtitle="Press dims and barely shrinks; disabled dims further; nothing bounces" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;display:flex;gap:14px;align-items:flex-end;background:var(--mb-color-background)}.c{display:flex;flex-direction:column;align-items:center;gap:8px}.b{min-width:120px;min-height:44px;border-radius:10px;background:var(--mb-color-accent);color:var(--mb-color-on-active-control);display:flex;align-items:center;justify-content:center;font-family:var(--mb-font-display);font-weight:600;font-size:14px}.n{font-family:var(--mb-font-mono);font-size:9px;color:var(--mb-color-text-muted)}</style>
</head><body>
<div class="c"><span class="b">Rest</span><span class="n">opacity 1</span></div>
<div class="c"><span class="b" style="opacity:.72">Pressed</span><span class="n">opacity 0.72</span></div>
<div class="c"><span class="b" style="opacity:.68;transform:scale(.985)">Pressed · control</span><span class="n">0.68 · scale 0.985</span></div>
<div class="c"><span class="b" style="opacity:.5">Disabled</span><span class="n">opacity 0.5</span></div>
<div class="c"><span class="b" style="background:transparent;border:1px solid var(--mb-color-border);color:var(--mb-color-accent);opacity:.45">Icon disabled</span><span class="n">opacity 0.45</span></div>
</body></html>
