<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:flex;flex-direction:column;gap:8px}.pane{padding:8px;border-radius:12px}.row{display:flex;gap:6px}.b{flex:1;height:42px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:5px 6px}.n{font-family:var(--mb-font-mono);font-size:8px;line-height:10px;letter-spacing:.5px;text-transform:uppercase}.h{font-family:var(--mb-font-mono);font-size:8px;line-height:10px}</style>
</head><body>
<div class="pane" style="background:#FCFBF8;border:1px solid #D9D7D1">

<div class="b" style="background:#2FA39B;color:#030712"><span class="n">transcribing</span><span class="h">#2FA39B</span></div>

<div class="b" style="background:#2FA39B;color:#030712"><span class="n">synthesizing</span><span class="h">#2FA39B</span></div>
<div class="b" style="background:#2E9E52;color:#030712"><span class="n">speaking</span><span class="h">#2E9E52</span></div>
</div>
</div>
<div class="pane" style="background:#16181D;border:1px solid #2C3138">
<div class="row">
<div class="b" style="background:#5DC17D;color:#030712"><span class="n">recording</span><span class="h">#5DC17D</span></div>
<div class="b" style="background:#4FD1C5;color:#030712"><span class="n">transcribing</span><span class="h">#4FD1C5</span></div>
<div class="b" style="background:#6BB2F5;color:#030712"><span class="n">brief</span><span class="h">#6BB2F5</span></div>

<div class="b" style="background:#4FD1C5;color:#030712"><span class="n">synthesizing</span><span class="h">#4FD1C5</span></div>

</div>
</div>
</body></html>
