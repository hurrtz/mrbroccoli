<!-- @dsCard group="Colors" viewport="700x180" name="Canvas and surfaces" subtitle="Warm off-white and warm near-black — never pure white, never true black" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{border-radius:12px;border:1px solid var(--mb-color-border);overflow:hidden}.sw{display:flex;align-items:center;gap:10px;padding:8px 12px}.chip{width:28px;height:28px;border-radius:6px;border:1px solid rgba(128,128,128,.35);flex:0 0 auto}.n{font-family:var(--mb-font-mono);font-size:10px;letter-spacing:.6px;text-transform:uppercase}.h{font-family:var(--mb-font-mono);font-size:10px;opacity:.7;margin-left:auto}</style>
</head><body>
<div class="pane" style="background:#FCFBF8;color:#1A1D24">
<div class="sw"><span class="chip" style="background:#FCFBF8"></span><span class="n">background</span><span class="h">#FCFBF8</span></div>
<div class="sw"><span class="chip" style="background:#FFFFFF"></span><span class="n">surface / elevated / raised</span><span class="h">#FFFFFF</span></div>
<div class="sw"><span class="chip" style="background:#EFEEE9"></span><span class="n">surface-alt</span><span class="h">#EFEEE9</span></div>
</div>
<div class="pane" style="background:#16181D;color:#EDF1F5">
<div class="sw"><span class="chip" style="background:#16181D"></span><span class="n">background</span><span class="h">#16181D</span></div>
<div class="sw"><span class="chip" style="background:#1D2025"></span><span class="n">surface / elevated</span><span class="h">#1D2025</span></div>
<div class="sw"><span class="chip" style="background:#262B33"></span><span class="n">surface-raised</span><span class="h">#262B33</span></div>
</div>
</body></html>
