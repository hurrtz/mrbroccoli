<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{border-radius:12px;padding:12px;display:flex;gap:10px}.b{flex:1;height:56px;border-radius:8px;display:flex;align-items:flex-end;padding:6px 8px}.n{font-family:var(--mb-font-mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase}</style>
</head><body>
<div class="pane" style="background:#FCFBF8;border:1px solid #D9D7D1">
<div class="b" style="background:#059669;color:#FFF"><span class="n">success #059669</span></div>
<div class="b" style="background:#DC2626;color:#FFF"><span class="n">danger #DC2626</span></div>
</div>
<div class="pane" style="background:#16181D;border:1px solid #2C3138">
<div class="b" style="background:#10B981;color:#111827"><span class="n">success #10B981</span></div>
<div class="b" style="background:#F87171;color:#111827"><span class="n">danger #F87171</span></div>
</div>
</body></html>
