<!-- @dsCard group="Colors" viewport="700x195" name="Text and lines" subtitle="Near-black or near-white body, muted blue-grey secondary, hairline borders" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}.l{font-family:var(--mb-font-body);font-size:14px}.n{font-family:var(--mb-font-mono);font-size:9px;opacity:.75;margin-left:6px}.rule{height:1px}</style>
</head><body>
<div class="pane" style="background:#FCFBF8;border:1px solid #D9D7D1">
<div class="l" style="color:#1A1D24">Text<span class="n">#1A1D24</span></div>
<div class="l" style="color:#5D6B7A">Secondary and muted<span class="n">#5D6B7A</span></div>
<div class="rule" style="background:#D9D7D1"></div><div class="l" style="color:#5D6B7A;font-size:11px">border #D9D7D1</div>
<div class="rule" style="background:#BDBAB2"></div><div class="l" style="color:#5D6B7A;font-size:11px">border-strong #BDBAB2</div>
</div>
<div class="pane" style="background:#16181D;border:1px solid #2C3138">
<div class="l" style="color:#EDF1F5">Text<span class="n">#EDF1F5</span></div>
<div class="l" style="color:#8B97A8">Secondary and muted<span class="n">#8B97A8</span></div>
<div class="rule" style="background:#2C3138"></div><div class="l" style="color:#8B97A8;font-size:11px">border #2C3138</div>
<div class="rule" style="background:#424851"></div><div class="l" style="color:#8B97A8;font-size:11px">border-strong #424851</div>
</div>
</body></html>
