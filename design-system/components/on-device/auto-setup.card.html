<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--mb-color-background);font-family:var(--mb-font-body)}.grid{display:grid;grid-template-columns:repeat(3,352px);gap:20px;align-items:start}.cap{font-family:var(--mb-font-mono);font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--mb-color-text-muted);margin:0 0 6px 2px}.live{margin-top:20px;max-width:352px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { AutoSetupCard, BackgroundTaskBar } = window.MrBroccoliDesignSystem_62d510;

const STATES = [
  ["Offer", { state: "offer" }],
  ["Measuring", { state: "scanning", scanned: 3 }],
  ["Proposal", { state: "proposal" }],
  ["Installing", { state: "installing", fraction: 0.46 }],
  ["Done", { state: "done" }],
  ["Failed", { state: "failed", error: { title: "Install did not finish", detail: "Whisper Small stopped at 62%. The connection dropped; nothing was left half-installed.", role: "listen", note: "Stopped at 62%. Not installed." } }],
];

function Demo() {
  return (
    <div>
      <div className="grid">
        {STATES.map(([label, props]) => (
          <div key={label}>
            <p className="cap">{label}</p>
            <AutoSetupCard {...props} showHeader={false} onManual={() => {}}
              onContinue={props.state === "installing" ? () => {} : undefined}
              onFinish={props.state === "done" ? () => {} : undefined} />
          </div>
        ))}
      </div>
      <div className="live">
        <p className="cap">Live — with header, runs itself</p>
        <AutoSetupCard onManual={() => {}} />
        <p className="cap" style={{ marginTop: 20 }}>The home-screen row while it runs</p>
        <BackgroundTaskBar title="Installing on-device AI" detail="Step 3 of 5 · about 2 min left" fraction={0.46} onPress={() => {}} />
        <BackgroundTaskBar tone="danger" icon="warning" title="On-device install stopped" detail="Tap to see what failed" onPress={() => {}} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
