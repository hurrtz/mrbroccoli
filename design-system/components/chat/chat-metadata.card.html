<!-- @dsCard group="Components" viewport="900x780" name="Chat · turn metadata" subtitle="The meta line opens the turn receipt as a modal; failure, notices and branch chips mount bare under the row" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:16px;background:var(--mb-color-background)}.lbl{font-family:var(--mb-font-mono);font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--mb-color-text-muted);margin:0 0 6px}.note{font-family:var(--mb-text-supporting-family);font-size:12px;line-height:17px;color:var(--mb-color-text-secondary);margin:6px 0 12px}.frame{position:relative;overflow:hidden;border:1px solid var(--mb-color-border);border-radius:var(--mb-radius-dialog);background:var(--mb-color-background);padding:2px 14px 6px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { TranscriptMessage, PipelineNotices, ReplyFailureCard, MessageBranchIndicator } = window.MrBroccoliDesignSystem_62d510;
const base = "../../assets/providers";
const ACTIONS = [{icon:"edit",label:"Correct transcript"},{icon:"branch",label:"Branch here"},{icon:"copy",label:"Copy"},{icon:"share-alt",label:"Share"},{icon:"sound",label:"Speak again"},{icon:"warning",label:"Report"}];
const RECEIPT = [
  { label: "Requested", value: "xAI · Grok 4.6" },
  { label: "Actual", value: "OpenRouter → xAI · Grok 4.6" },
  { label: "Effort", value: "High" },
  { label: "Timing", value: "stt 0.8 s · context 0.2 s · search 1.2 s · model 248 s · total 250 s" },
  { label: "Usage", value: "~6.2k prompt · 2.3k completion · ~8.5k total" },
  { label: "Web search", value: "Timetables agree on the turn at 15:40." },
  { label: "Sources 1", value: "tides.pt · https://tides.pt/lisbon" },
  { label: "Council", value: "3 rounds · 11 successful · 1 failed" },
];
const PARAGRAPHS = ["High water is at 15:40 on Saturday, and the tide turns roughly every six hours after that.", "Three of the four models agreed on the time; the fourth did not answer."];
function Turn({ open, setOpen, last }){
  return <TranscriptMessage role="assistant" provider="xai" model="Grok 4.6" time="14:12" last={last} expanded onToggle={()=>{}}
    paragraphs={PARAGRAPHS} meta="3 sources · OpenRouter · 250 s" metrics={RECEIPT}
    metricsOpen={open} onOpenMetrics={()=>setOpen(true)} onCloseMetrics={()=>setOpen(false)} metricsInline
    actions={ACTIONS} assetBase={base} />;
}
function Left(){
  const [open, setOpen] = React.useState(true);
  const [shut, setShut] = React.useState(false);
  return <div>
    <p className="lbl">The receipt · a modal, not a panel</p>
    <p className="note">Tapping the meta line opens <strong>Turn receipt</strong> as a titled dialogue with a Done action — label/value rows in mono, scrolling inside the card. Nothing expands under the message, so the row keeps its height and the transcript never reflows beneath your thumb.</p>
    <div className="frame" style={{height:330}}><Turn open={open} setOpen={setOpen} /></div>
    <p className="lbl" style={{marginTop:14}}>The trigger, closed</p>
    <p className="note">A 44pt row of mono text ending in an <code>info-circle</code>: <strong>“3 sources · OpenRouter · 250 s”</strong>. It reports what the turn cost you; the receipt explains it. Present only when usage stats are on, and hidden while a foldable row is collapsed.</p>
    <div className="frame"><Turn open={shut} setOpen={setShut} last /></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(
  <div style={{display:"grid",gridTemplateColumns:"1.25fr 1fr",gap:16,alignItems:"start"}}>
    <Left />
    <div>
      <p className="lbl">What mounts under the row</p>
      <p className="note">These are not children of a bubble — <strong>TranscriptMessage</strong> mounts them itself, in this order, under the message they belong to.</p>
      <p className="lbl" style={{marginTop:12}}>Reply failure</p>
      <ReplyFailureCard message="Anthropic returned 529: overloaded."
        hint="Your message was kept. Retrying sends it again unchanged." onRetry={() => {}} />
      <p className="lbl" style={{marginTop:12}}>Pipeline notice</p>
      <PipelineNotices notices={[{stageLabel:"Text to speech",level:"error",
        message:"ElevenLabs rejected the request.",detail:"Voice quota exhausted",
        actions:[{icon:"sound",label:"Retry speech"},{icon:"setting",label:"Speaking settings",tone:"quiet"}]}]} />
      <p className="lbl" style={{marginTop:12}}>Branch provenance chips</p>
      <MessageBranchIndicator originLabel="Context kept from 'Naming the boat'" onOpenSource={() => {}} branchesLabel="2 branches" onOpenBranches={() => {}} />
      <p className="note" style={{marginTop:14}}>Three sub-cards, and only three: everything a turn did that used to sit in its own disclosure is a row in the Turn receipt modal.</p>
    </div>
  </div>
);
</script></body></html>
