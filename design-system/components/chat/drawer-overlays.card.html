<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Mr Broccoli — drawer overlays</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;padding:24px;background:#8f8d86;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;justify-content:center;font-family:var(--mb-font-body)}
.cap{font-family:var(--mb-font-mono);font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:#2a2b2e;margin:0 0 8px 4px}
.cap.d{color:#e6e4dd}
.frame{width:372px;height:620px;border-radius:24px;overflow:hidden;position:relative;transform:translateZ(0);background:var(--mb-color-background);box-shadow:0 14px 36px rgba(0,0,0,.3);border:1px solid rgba(0,0,0,.25)}
.frame.short{height:340px}
</style>
</head><body>
<div><p class="cap">Actions sheet · archive is the system addition</p><div class="frame" id="sheet"></div></div>
<div><p class="cap d">Rename</p><div class="frame short" data-theme="dark" id="rename"></div></div>
<div><p class="cap">Integrity · findings</p><div class="frame short" id="integrity-findings"></div></div>
<div><p class="cap d">Integrity · clean</p><div class="frame short" data-theme="dark" id="integrity-clean"></div></div>
<script type="text/babel">
const { ConversationActionSheet, ConversationRenameModal, ConversationIntegrityModal } = window.MrBroccoliDesignSystem_62d510;
const c = { id: "c7", title: "Naming the boat", messageCount: 41, pinned: false, isPrivate: false, archived: false };
const noop = () => {};
ReactDOM.createRoot(document.getElementById("sheet")).render(
  <ConversationActionSheet inline conversation={c} onClose={noop} onTogglePinned={noop} onTogglePrivate={noop} onRename={noop} onToggleArchived={noop} onReviewIntegrity={noop} onManageMemory={noop} onShare={noop} onCopy={noop} onDelete={noop} />);
function RenameDemo(){
  const [v, setV] = React.useState("Naming the boat");
  return <ConversationRenameModal inline visible title="Naming the boat" value={v} onChange={setV} onSubmit={noop} onClose={noop} />;
}
ReactDOM.createRoot(document.getElementById("rename")).render(<RenameDemo />);
ReactDOM.createRoot(document.getElementById("integrity-findings")).render(
  <ConversationIntegrityModal inline conversation={c} state="findings" findingsCount={3} repairableCount={2} onRepair={noop} onExportOriginals={noop} onClose={noop} />);
ReactDOM.createRoot(document.getElementById("integrity-clean")).render(
  <ConversationIntegrityModal inline conversation={c} state="clean" onClose={noop} />);
</script>
</body></html>
