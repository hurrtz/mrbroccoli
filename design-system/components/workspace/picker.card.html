<style>body{margin:0;padding:18px;display:flex;gap:18px;font-family:var(--mb-font-body)}.pane{flex:1;min-width:320px;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--mb-color-background)}.lbl{font-family:var(--mb-font-mono);font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--mb-color-text-muted);margin:0}.note{font-family:var(--mb-text-supporting-family);font-size:12px;line-height:17px;color:var(--mb-color-text-secondary);margin:0}</style>

<div class="pane" data-theme="light" id="light"></div>
<div class="pane" data-theme="dark" id="dark" style="background:#16181D;border:1px solid #2C3138"></div>
<script type="text/babel">
const { Picker } = window.MrBroccoliDesignSystem_62d510;
const VOICES = [{value:"heart",label:"Heart · American female"},{value:"river",label:"River · British female"},{value:"puck",label:"Puck · American male"}];
function Specimen(){
  const [voice, setVoice] = React.useState("heart");
  return <>
    <p className="lbl">Picker · selected</p>
    <Picker label="Voice" value={voice} dropdownLabel="Selection" onChange={setVoice} options={VOICES} />
    <p className="lbl">Disabled · no route to pick from</p>
    <Picker label="Voice" value="heart" dropdownLabel="Selection" onChange={()=>{}} options={VOICES} disabled />
    <p className="note">Settings use rows, not dropdowns — a picker appears only where a single value comes from a long list the app cannot lay out as rows, and the list itself is the platform's own. The intro banner that used to share this card is retired: the home screen advertises nothing.</p>
  </>;
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
</script></body></html>
