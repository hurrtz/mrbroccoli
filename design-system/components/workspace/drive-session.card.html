.pane{flex:1;min-width:380px;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--mb-color-background)}

<div class="pane" data-theme="light" id="light"></div>
<div class="pane" data-theme="dark" id="dark"></div>
<script type="text/babel">
const { DriveSessionControls } = window.MrBroccoliDesignSystem_62d510;
function Specimen(){
  return <>
    <p className="lbl">Live · silence counting down</p>
    <DriveSessionControls running canRepeat countdownSeconds={4} />
    <p className="lbl">Live · listening</p>
    <DriveSessionControls running canRepeat />

    <DriveSessionControls running={false} canRepeat />

    <DriveSessionControls running disabled />
  </>;
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
