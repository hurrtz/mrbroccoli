<style>body{margin:0;padding:14px;display:flex;gap:14px;align-items:flex-start}.pane{flex:1;min-width:0;padding:12px;border-radius:14px;display:flex;flex-direction:column;gap:12px}.orbs{display:flex;gap:8px;align-items:center;justify-content:space-between}.c{display:flex;flex-direction:column;align-items:center;gap:5px}.l{font-family:var(--mb-font-mono);font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--mb-color-text-muted)}.row{display:flex;gap:10px;justify-content:center;align-items:flex-start}.clusters{display:flex;gap:10px;justify-content:space-around;align-items:flex-start}</style>

<div class="pane" data-theme="light" style="background:#FCFBF8;border:1px solid #D9D7D1"><div id="light"></div></div>
<div class="pane" data-theme="dark" style="background:#16181D;border:1px solid #2C3138"><div id="dark"></div></div>
<script type="text/babel">
const { VoiceOrb, OrbSatellite, OrbTransport, TranscriptHandle } = window.MrBroccoliDesignSystem_62d510;

function VoiceOrbSpecimen(){
  return <>
    <div className="orbs">
      <div className="c"><VoiceOrb size={62} /><span className="l">idle</span></div>
      <div className="c"><VoiceOrb size={62} phase="recording" phaseProgress={0.42} turnProgress={0.10} /><span className="l">recording</span></div>
      <div className="c"><VoiceOrb size={62} phase="searching" phaseProgress={0.66} turnProgress={0.52} /><span className="l">searching</span></div>
      <div className="c"><VoiceOrb size={62} phase="thinking" phaseProgress={0.45} turnProgress={0.70} /><span className="l">thinking</span></div>
      <div className="c"><VoiceOrb size={62} phase="speaking" phaseProgress={0.38} turnProgress={0.96} /><span className="l">speaking</span></div>
      <div className="c"><VoiceOrb size={62} phase="thinking" phaseProgress={1} turnProgress={1} overtime={0.55} /><span className="l">55% late</span></div>
    </div>
    <div className="row">
      <OrbSatellite icon="image" label="Image" accessibilityLabel="Add image" />
      <OrbSatellite icon="council" label="Council" kind="toggle" accessibilityLabel="Model Council" />
      <OrbSatellite icon="search" label="Web" kind="toggle" active accessibilityLabel="Web search" />
      <OrbSatellite icon="car" label={"Hands\nfree"} kind="toggle" active accessibilityLabel="Hands-free conversation" />
      <OrbSatellite icon="stop" label="Stop" tone="danger" />
      <OrbSatellite icon="back" label="Back" disabled />
    </div>
    <span className="l" style={{textAlign:"center"}}>action · switch off · switch on (filled glyph, accent) · the session switch · danger · disabled</span>
    <div className="clusters">
      <div className="c"><OrbTransport phase="speaking" phaseProgress={0.42} orbSize={96} /><span className="l">transport orbit · speaking (all four live)</span></div>
    </div>
    <TranscriptHandle messageCount={12} />
  </>;
}
ReactDOM.createRoot(document.getElementById("light")).render(<VoiceOrbSpecimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<VoiceOrbSpecimen />);
</script>
