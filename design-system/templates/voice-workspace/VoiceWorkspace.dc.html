<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Voice workspace" description="The Mr Broccoli home screen: route byline, settings sentence, orb, satellites, transcript handle." -->
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="./ds-base.js"></script>
<style>body{margin:0;background:#8f8d86}</style>
</helmet>
<div data-theme="{{ appearance }}" style="min-height:100vh;background:var(--mb-color-background);display:flex;justify-content:center;font-family:var(--mb-font-body)">
<div style="width:390px;min-height:100vh;display:flex;flex-direction:column;padding:0 16px 12px;box-sizing:border-box">
<div style="display:flex;align-items:center;justify-content:space-between;min-height:62px;padding-top:8px;padding-bottom:10px">
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.IconButton" icon="menu" accessibility-label="Conversations" hint-size="44px,44px"></x-import>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.AppWordmark" hint-size="140px,28px"></x-import>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.IconButton" icon="setting" accessibility-label="Settings" hint-size="44px,44px"></x-import>
</div>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.RouteByline" provider="openai" provider-label="OpenAI" model-name="GPT-5" effort="Extra high" asset-base="../../assets/providers" hint-size="100%,44px"></x-import>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.ConversationSettingsSummary" summary="Balanced · Brief · Heart · Web search on" hint-size="100%,44px"></x-import>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:12px 0">
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.VoiceOrb" phase="idle" size="{{ orbSize }}" hint-size="196px,196px"></x-import>
<div style="display:flex;align-items:flex-start;justify-content:center;gap:20px">
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.OrbSatellite" icon="image" label="Image" accessibility-label="Add image" hint-size="64px,66px"></x-import>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.OrbSatellite" icon="council" label="Council" kind="toggle" accessibility-label="Model Council" hint-size="64px,66px"></x-import>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.OrbSatellite" icon="search" label="Search" kind="toggle" active="{{ searchOn }}" accessibility-label="Web search" hint-size="64px,66px"></x-import>
</div>
</div>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.TranscriptHandle" message-count="{{ messageCount }}" meta="GPT-5 · 2 min ago" preview="High water is at 15:40 today, and the tide turns roughly every six hours." hint-size="100%,74px"></x-import>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;appearance&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;\&quot;light\&quot; | \&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;orbSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:96,&quot;max&quot;:220,&quot;step&quot;:4,&quot;default&quot;:196,&quot;unit&quot;:&quot;pt&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;messageCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:0,&quot;max&quot;:99,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;searchOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      appearance: this.props.appearance ?? "light",
      orbSize: this.props.orbSize ?? 196,
      messageCount: this.props.messageCount ?? 12,
      searchOn: this.props.searchOn ?? true,
    };
  }
}
</script>
</body>
</html>
