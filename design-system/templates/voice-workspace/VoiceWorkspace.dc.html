<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Voice workspace" description="The Mr Broccoli home screen: route byline, settings sentence, orb, satellites, transcript handle." -->
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="./ds-base.js"></script>
<style>body{margin:0;background:#8f8d86}</style>
</helmet>
<div data-theme="{{ appearance }}" style="min-height:100vh;background:var(--mb-color-background);display:flex;justify-content:center;font-family:var(--mb-font-body)">
<div style="width:390px;min-height:100vh;display:flex;flex-direction:column;padding:0 16px 12px;box-sizing:border-box">
<div style="display:flex;align-items:center;justify-content:space-between;min-height:62px;padding-top:8px;padding-bottom:10px">
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.IconButton" icon="menu" accessibility-label="Conversations" hint-size="44px,44px"></x-import>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.AppWordmark" hint-size="140px,28px"></x-import>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.IconButton" icon="setting" accessibility-label="Settings" hint-size="44px,44px"></x-import>
</div>
<div style="height:14px"></div>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.WorkspaceHeader" provider="openai" provider-label="OpenAI" model-name="GPT-5" effort="Extra high" summary="{{ summary }}" asset-base="../../assets/providers" hint-size="100%,90px"></x-import>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:12px 0">
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.OrbTransport" phase="{{ phase }}" orb-size="{{ orbSize }}" phase-progress="{{ phaseProgress }}" turn-progress="{{ phaseProgress }}" hint-size="328px,227px"></x-import>
<div style="display:flex;align-items:flex-start;justify-content:center;gap:20px">
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.OrbSatellite" icon="image" label="{{ imageLabel }}" thumbnails="{{ thumbs }}" accessibility-label="{{ imageLabel }}" disabled="{{ busy }}" hint-size="64px,66px"></x-import>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.OrbSatellite" icon="council" label="Council" kind="toggle" disabled="{{ busy }}" accessibility-label="Model Council" hint-size="64px,66px"></x-import>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.OrbSatellite" icon="search" label="Search" kind="toggle" active="{{ searchOn }}" disabled="{{ busy }}" accessibility-label="Web search" hint-size="64px,66px"></x-import>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.OrbSatellite" icon="car" label="{{ handsFreeLabel }}" kind="toggle" active="{{ handsFree }}" accessibility-label="Hands-free conversation" hint-size="64px,73px"></x-import>
</div>
</div>
<x-import component-from-global-scope="MrBroccoliDesignSystem_62d510.TranscriptHandle" message-count="{{ messageCount }}" hint-size="100%,68px"></x-import>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;appearance&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;\&quot;light\&quot; | \&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;phase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;recording&quot;,&quot;thinking&quot;,&quot;speaking&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;\&quot;idle\&quot; | \&quot;recording\&quot; | \&quot;thinking\&quot; | \&quot;speaking\&quot;&quot;,&quot;section&quot;:&quot;State&quot;},&quot;handsFree&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;images&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:0,&quot;max&quot;:40,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;State&quot;},&quot;orbSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:96,&quot;max&quot;:220,&quot;step&quot;:4,&quot;default&quot;:196,&quot;unit&quot;:&quot;pt&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;messageCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:0,&quot;max&quot;:99,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;searchOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const phase = this.props.phase ?? "idle";
    const busy = phase !== "idle";
    /* Images live in the Image satellite: the deck replaces its glyph, the
       caption counts, and the row's geometry never changes. */
    const images = this.props.images ?? 0;
    const handsFree = this.props.handsFree ?? false;
    return {
      handsFree,
      handsFreeLabel: "Hands\nfree",
      summary: (handsFree ? "Hands free: on · " : "") + "Length: Brief · Tone: Balanced · Voice: Heart",
      thumbs: images ? Array.from({ length: images }, () => null) : undefined,
      imageLabel: images ? images + (images === 1 ? " image" : " images") : "Image",
      appearance: this.props.appearance ?? "light",
      orbSize: this.props.orbSize ?? 196,
      messageCount: this.props.messageCount ?? 12,
      searchOn: this.props.searchOn ?? true,
      phase,
      busy,
      /* The composing row never changes its verbs; it only rests. */
      composingOpacity: busy ? 0.34 : 1,
      phaseProgress: busy ? 0.42 : 0,
    };
  }
}
</script>
</body>
</html>
