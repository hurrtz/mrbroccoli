<!-- @dsCard group="Mr Broccoli iPad" viewport="1180x820" name="iPad" subtitle="Persistent sidebar, landscape tri-pane, compact collapses to the phone pattern, settings master-detail — settled direction, not yet in the app" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mr Broccoli — iPad</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script src="../settings/data.js"></script>
<style>
body{margin:0;padding:24px;background:#8f8d86;font-family:var(--mb-font-body)}
.row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin-bottom:22px}
.cap{font-family:var(--mb-font-mono);font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:#2b2c2e;margin:0 0 6px 2px;max-width:520px}
.cap.d{color:#e6e4dd}
.device{border-radius:24px;overflow:hidden;position:relative;background:var(--mb-color-background);box-shadow:0 18px 44px rgba(0,0,0,.3);border:1px solid rgba(0,0,0,.25)}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="../settings/SettingsFrame.jsx"></script>
<script type="text/babel" src="../settings/SettingsOverview.jsx"></script>
<script type="text/babel" src="../settings/PagesConversation.jsx"></script>
<script type="text/babel" src="../settings/PagesVoice.jsx"></script>
<script type="text/babel" src="../settings/PagesPrivacy.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="WorkspacePane.jsx"></script>
<script type="text/babel" src="Settings.jsx"></script>
<script type="text/babel">
const { IntroFlow } = window.MrBroccoliDesignSystem_62d510;

function WorkspaceFrame({ theme, portrait, compact, triPane, initialDrawerOpen, initialTranscriptOpen }) {
  const [active, setActive] = React.useState("c1");
  const [drawerOpen, setDrawerOpen] = React.useState(!!initialDrawerOpen);
  const [transcriptOpen, setTranscriptOpen] = React.useState(!!initialTranscriptOpen);
  return (
    <div data-theme={theme} style={{ display: "flex", height: "100%", position: "relative", overflow: "hidden" }}>
      {compact ? null : (
        <window.IpadSidebar conversations={window.MB_IPAD.conversations} activeId={active} onSelect={(c) => setActive(c.id)} width={portrait ? 300 : (triPane ? 296 : 336)} />
      )}
      <window.IpadWorkspaceContent compact={compact} onOpenDrawer={() => setDrawerOpen(true)}
        orbSize={compact ? 168 : (triPane ? 204 : (portrait ? 208 : 224))}
        showHandle={!triPane}
        transcriptOpen={transcriptOpen} onOpenTranscript={() => setTranscriptOpen(true)} onCloseTranscript={() => setTranscriptOpen(false)} />
      {triPane ? <window.TranscriptColumn /> : null}
      {compact && drawerOpen ? (
        <window.IpadDrawerOverlay conversations={window.MB_IPAD.conversations} activeId={active} onSelect={(c) => setActive(c.id)} onClose={() => setDrawerOpen(false)} />
      ) : null}
    </div>
  );
}

function SettingsRegularFrame({ theme }) {
  const [active, setActive] = React.useState("speaking");
  return <div data-theme={theme} style={{ height: "100%", position: "relative" }}>
    <window.IpadSettingsRegular active={active} onSelect={setActive} isPremium onClose={() => {}} />
  </div>;
}
function SettingsCompactFrame({ theme }) {
  return <div data-theme={theme} style={{ height: "100%", position: "relative" }}>
    <window.IpadSettingsCompact isPremium onClose={() => {}} />
  </div>;
}
function OnboardingFrame({ theme, step }) {
  return (
    <div data-theme={theme} style={{ height: "100%", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--mb-color-background)", padding: 26, boxSizing: "border-box" }}>
      <div style={{ width: "100%", maxWidth: 640, height: "100%", position: "relative", borderRadius: 20, overflow: "hidden", border: "1px solid var(--mb-color-border)", boxShadow: "0 20px 50px rgba(0,0,0,.16)" }}>
        <IntroFlow visible initialStep={step} firstRun={false} thinkingReady={step >= 1} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<>
  <div className="row">
    <div><p className="cap">Workspace · landscape · regular width — sidebar, orb and transcript all docked open at once; there's room, so nothing is hidden behind a tap</p>
      <div className="device" style={{ width: 1180, height: 820 }}><WorkspaceFrame theme="light" triPane /></div></div>
  </div>
  <div className="row">
    <div><p className="cap">Workspace · portrait · regular width — narrower here, so the transcript stays a handle + pulled-up sheet</p>
      <div className="device" style={{ width: 820, height: 1180 }}><WorkspaceFrame theme="dark" portrait /></div></div>
    <div><p className="cap">Workspace · compact width (Split View / Slide Over) — collapses to exactly the phone pattern: menu button, overlay drawer</p>
      <div className="device" style={{ width: 320, height: 980 }}><WorkspaceFrame theme="light" compact initialDrawerOpen /></div></div>
    <div><p className="cap">Transcript open · portrait · regular width — still a sheet here, since portrait lacks landscape's extra column</p>
      <div className="device" style={{ width: 820, height: 1180 }}><WorkspaceFrame theme="dark" portrait initialTranscriptOpen /></div></div>
  </div>
  <div className="row">
    <div><p className="cap">Settings · regular width — sidebar master-detail: categories left (grouped as the phone overview), page right, no back control</p>
      <div className="device" style={{ width: 1180, height: 820 }}><SettingsRegularFrame theme="light" /></div></div>
  </div>
  <div className="row">
    <div><p className="cap">Settings · portrait · regular width — same master-detail, narrower detail column</p>
      <div className="device" style={{ width: 820, height: 1180 }}><SettingsRegularFrame theme="dark" /></div></div>
    <div><p className="cap">Settings · compact width — collapses to the phone's own overview → page push, unmodified</p>
      <div className="device" style={{ width: 320, height: 980 }}><SettingsCompactFrame theme="light" /></div></div>
  </div>
  <div className="row">
    <div><p className="cap">Onboarding · step 1 — centred, fixed-width card regardless of window size or orientation</p>
      <div className="device" style={{ width: 900, height: 760 }}><OnboardingFrame theme="light" step={0} /></div></div>
    <div><p className="cap">Onboarding · step 2 — IntroFlow itself is untouched; widening the window would only lengthen the eye's travel</p>
      <div className="device" style={{ width: 900, height: 760 }}><OnboardingFrame theme="dark" step={1} /></div></div>
  </div>
</>);
</script>
</body></html>
