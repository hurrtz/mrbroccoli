<!-- @dsCard group="Mr Broccoli app" viewport="820x1850" name="Mobile app" subtitle="Voice-first workspace incl. the hands-free switch, conversations and settings, portrait and landscape" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mr Broccoli — mobile app</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<script src="../settings/data.js"></script>
<style>
body{margin:0;background:#8f8d86;display:flex;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding:24px;gap:24px;font-family:var(--mb-font-body)}
.device{width:372px;height:652px;border-radius:34px;overflow:hidden;position:relative;transform:translateZ(0);background:var(--mb-color-background);box-shadow:0 18px 44px rgba(0,0,0,.32);border:1px solid rgba(0,0,0,.25)}
.device.land{width:700px;height:372px}
.caption{font-family:var(--mb-font-mono);font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:#2a2b2e;margin:0 0 8px 4px}
.status{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-family:var(--mb-font-mono);font-size:10px;color:var(--mb-color-text-secondary)}
.screen{position:absolute;inset:26px 0 0;overflow:hidden}
</style>
</head><body>
<div><p class="caption">Light</p><div class="device" id="light" data-theme="light"></div></div>
<div><p class="caption">Dark</p><div class="device" id="dark" data-theme="dark"></div></div>
<div><p class="caption">Hands free on · the loop as a row switch</p><div class="device" id="drive" data-theme="light"></div></div>
<div><p class="caption">In conversation · transcript open</p><div class="device" id="conversation" data-theme="dark"></div></div>
<div><p class="caption">Landscape</p><div class="device land" id="landscape" data-theme="light"></div></div>
<script type="text/babel" src="./Workspace.jsx"></script>
<script type="text/babel" src="../settings/SettingsFrame.jsx"></script>
<script type="text/babel" src="../settings/AutoSetup.jsx"></script>
<script type="text/babel" src="../settings/SettingsOverview.jsx"></script>
<script type="text/babel" src="../settings/PagesConversation.jsx"></script>
<script type="text/babel" src="../settings/PagesVoice.jsx"></script>
<script type="text/babel" src="../settings/PagesPrivacy.jsx"></script>
<script type="text/babel" src="./ConversationDrawerScreen.jsx"></script>
<script type="text/babel">
const SETTINGS_PAGES = () => ({
  connections: window.ConnectionsPage, thinking: window.ThinkingPage, search: window.SearchPage,
  listening: window.ListeningPage, speaking: window.SpeakingPage,
  data: window.DataPrivacyPage, app: window.AppPage,
});
function App({ initialRoute, failInstall, initialTranscript, handsFree }){
  const [route,setRoute]=React.useState(initialRoute||"workspace");
  const [conversation,setConversation]=React.useState(window.MB_DATA.conversations[0]);
  const [toast,setToast]=React.useState(null);
  const [intro,setIntro]=React.useState(false);
  // The toast exists for the case the user is neither in the walkthrough nor on
  // the page that owns the install: in both of those places the outcome is
  // already stated in full, and a toast on top of it would say it twice.
  const place=React.useRef({route,intro});
  place.current={route,intro};
  const elsewhere=()=>place.current.route!=="app"&&!place.current.intro;
  const auto=window.useAutoSetupFlow({
    failAt: failInstall?0.55:undefined,
    onFinished:()=>{ if(elsewhere()) setToast({tone:"success",message:"On-device AI is ready. Three models installed."}); },
    onFailed:()=>{ if(elsewhere()) setToast({tone:"danger",message:"Whisper Small failed to install. The other model finished."}); },
  });
  return <>
    <div className="status"><span>9:41</span><span>Mr Broccoli</span><span>100%</span></div>
    <div className="screen">
      {route==="workspace" ? <window.Workspace conversationTitle={conversation.title} toast={toast}
        onDismissToast={()=>setToast(null)} auto={auto} introVisible={intro} onIntroVisible={setIntro} initialTranscript={initialTranscript}
        onOpenLocalModels={()=>{setIntro(false);setRoute("app");}} handsFreeInitially={handsFree}
        onOpenDrawer={()=>setRoute("drawer")} onOpenSettings={()=>setRoute("settings")} /> : null}
      {route==="drawer" ? <window.ConversationDrawerScreen activeId={conversation.id}
        onSelect={(next)=>{setConversation(next);setRoute("workspace");}}
        onClose={()=>setRoute("workspace")} /> : null}
      {route==="settings" ? <window.SettingsOverview isPremium onOpenPage={setRoute}
        onOpenPremium={()=>{}} onClose={()=>setRoute("workspace")} /> : null}
      {SETTINGS_PAGES()[route] ? React.createElement(SETTINGS_PAGES()[route], {
        auto, onBack: ()=>setRoute("settings"), onClose: ()=>setRoute("workspace") }) : null}
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById("light")).render(<App initialRoute="workspace" />);
ReactDOM.createRoot(document.getElementById("dark")).render(<App initialRoute="app" failInstall />);
ReactDOM.createRoot(document.getElementById("drive")).render(<App initialRoute="workspace" handsFree />);
ReactDOM.createRoot(document.getElementById("conversation")).render(<App initialRoute="workspace" initialTranscript />);
ReactDOM.createRoot(document.getElementById("landscape")).render(<>
  <div className="status"><span>9:41</span><span>Mr Broccoli</span><span>100%</span></div>
  <div className="screen"><window.LandscapeWorkspace conversationTitle="Tide tables" onOpenDrawer={()=>{}} onOpenSettings={()=>{}} /></div>
</>);
</script>
</body></html>
